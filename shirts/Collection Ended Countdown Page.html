<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="shortcut icon" href="/favicon.ico" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xcabxyc</title>
  <style>
    @font-face {
      font-family: "Typeright";
      src: url("https://www.xcab.xyz/fonts/TypeRight.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg: #0000;
      --text: #f5f5f5;
      --green: #18ff00;
      --green-hover: #31ff1b;
      --shadow: rgba(0, 0, 0, 0.25);
      --title-font: "Typeright", "American Typewriter", "Courier New", monospace;
      --button-font: "Typeright", "American Typewriter", "Courier New", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100vh;
      font-family: var(--title-font);
    }

    .page {
      min-height: 100vh;
      width: 100%;
      padding: 4.2vw 4.6vw;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 2rem;
      background: #000;
      flex-wrap: wrap;
    }

    .site-title {
      margin: 0;
      font-family: var(--title-font);
      font-weight: 400;
      font-size: clamp(2.4rem, 4.2vw, 4.4rem);
      line-height: 1;
      letter-spacing: 0;
      color: #f3f3f3;
      white-space: nowrap;
      padding-top: 0.1em;
    }

    .button-row {
      display: flex;
      align-items: flex-start;
      gap: clamp(0.75rem, 2vw, 2rem);
      padding-top: 0.3vw;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-button {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: var(--green);
      color: #111;
      text-decoration: none;
      font-family: var(--button-font);
      font-size: clamp(1.85rem, 3.2vw, 3.5rem);
      line-height: 1;
      padding: 0.22em 0.35em 0.18em;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.15), 0 1px 0 var(--shadow);
      transition: transform 120ms ease, background-color 120ms ease;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-button:hover,
    .nav-button:focus-visible {
      background: var(--green-hover);
      transform: translateY(-1px);
      outline: none;
    }

    .nav-button:active {
      transform: translateY(0);
    }

    .left-column {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      flex: 1 1 100%;
    }

    .collection-ended {
      width: 100%;
      min-height: 55vh;
      margin-top: 4.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #f3f3f3;
      font-family: var(--title-font);
    }

    .ended-message {
      margin: 0;
      font-family: var(--title-font);
      font-weight: 400;
      font-size: clamp(3rem, 8vw, 8rem);
      line-height: 0.95;
      letter-spacing: 0;
      color: #f3f3f3;
    }

    .countdown-wrap {
      margin-top: clamp(2rem, 4vw, 4rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .countdown-label {
      margin: 0;
      font-family: var(--button-font);
      font-size: clamp(1.4rem, 2.6vw, 2.4rem);
      line-height: 1;
      color: #f3f3f3;
    }

    .countdown {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: clamp(0.75rem, 2vw, 1.5rem);
      flex-wrap: wrap;
    }

    .countdown-unit {
      min-width: clamp(5rem, 12vw, 9rem);
      background: #dcdcdc;
      color: #111;
      border: 2px dashed #8a8a8a;
      padding: clamp(0.8rem, 2vw, 1.4rem) clamp(0.7rem, 1.6vw, 1.2rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 0 var(--shadow);
    }

    .countdown-number {
      font-family: var(--button-font);
      font-size: clamp(2.3rem, 5vw, 5rem);
      line-height: 0.9;
      color: #111;
    }

    .countdown-text {
      margin-top: 0.35rem;
      font-family: var(--button-font);
      font-size: clamp(1rem, 2vw, 1.7rem);
      line-height: 1;
      color: #111;
    }

    .countdown-date {
      margin: 0.8rem 0 0;
      font-family: var(--button-font);
      font-size: clamp(1.1rem, 2vw, 1.7rem);
      line-height: 1.1;
      color: #f3f3f3;
    }

    .faq-footer {
      width: 100%;
      padding: 2rem 1rem 1.5rem;
      text-align: center;
      background: #000;
    }

    .faq-footer a {
      color: #f3f3f3;
      font-family: var(--button-font);
      font-size: clamp(1rem, 1.5vw, 1.35rem);
      text-decoration: none;
    }

    .faq-footer a:hover,
    .faq-footer a:focus-visible {
      color: var(--green);
      outline: none;
    }

    @media (max-width: 700px) {
      .page {
        min-height: 100vh;
        padding: 1.5rem 1rem;
        flex-direction: row;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
      }

      .site-title {
        font-size: clamp(2rem, 8vw, 2.8rem);
        line-height: 1;
        margin: 0;
        white-space: nowrap;
      }

      .button-row {
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        justify-content: flex-end;
        gap: 0.5rem;
        flex-wrap: nowrap;
      }

      .nav-button {
        font-size: clamp(1rem, 4.5vw, 1.5rem);
        padding: 0.25em 0.4em 0.2em;
        line-height: 1;
        white-space: nowrap;
      }

      .collection-ended {
        min-height: 62vh;
        margin-top: 3rem;
      }

      .ended-message {
        font-size: clamp(3rem, 15vw, 5.5rem);
      }

      .countdown {
        gap: 0.65rem;
      }

      .countdown-unit {
        min-width: calc(50% - 0.65rem);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="left-column">
      <h1 class="site-title">xcabxyc</h1>

      <section class="collection-ended" aria-label="Collection ended notice">
        <h2 class="ended-message">This collection has ended.</h2>

        <div class="countdown-wrap" aria-label="Countdown to August 1st, 7PM UK time">
          <p class="countdown-label">next collection in</p>

          <div class="countdown">
            <div class="countdown-unit">
              <span class="countdown-number" id="days">00</span>
              <span class="countdown-text">days</span>
            </div>
            <div class="countdown-unit">
              <span class="countdown-number" id="hours">00</span>
              <span class="countdown-text">hours</span>
            </div>
            <div class="countdown-unit">
              <span class="countdown-number" id="minutes">00</span>
              <span class="countdown-text">mins</span>
            </div>
            <div class="countdown-unit">
              <span class="countdown-number" id="seconds">00</span>
              <span class="countdown-text">secs</span>
            </div>
          </div>

          <p class="countdown-date">August 1st · 7PM UK time</p>
        </div>
      </section>
    </div>

    <nav class="button-row" aria-label="Main links">
      <a class="nav-button" href="https://xcab.xyz">go back</a>
    </nav>
  </main>

  <footer class="faq-footer">
    <a href="https://www.xcab.xyz/shirts/faq/">faq</a>
  </footer>

  <script>
    const targetDate = new Date("2026-08-01T18:00:00Z");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const now = new Date();
      const distance = targetDate.getTime() - now.getTime();

      if (distance <= 0) {
        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / (1000 * 60)) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      document.getElementById("days").textContent = pad(days);
      document.getElementById("hours").textContent = pad(hours);
      document.getElementById("minutes").textContent = pad(minutes);
      document.getElementById("seconds").textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
