<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>portfolio</title>
  <meta name="description" content="Portfolio of Day Powley" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Main content -->
  <main class="content">
    <div class="container">

      <!-- Header / Navigation -->
      <header class="header">
        <button class="logo" id="logo" aria-label="Home">
          <span class="logo-name">xcabxyc</span>
        </button>
        <nav class="nav" id="nav"><!-- nav links injected by script.js --></nav>
      </header>

      <!-- Grid of blocks (injected by script.js) -->
      <div class="grid" id="grid"></div>

      <!-- Detail view (shown when a block is expanded) -->
      <div class="detail" id="detail" hidden></div>

      <!-- Footer -->
      <footer class="footer">
        <div class="copyright">
          &copy; <span class="year">2026</span> Day Powley
        </div>
        <div class="socials">
          <a href="mailto:dayexsomusic@gmail.com" aria-label="Email" class="social">✉</a>
          <a href="https://www.instagram.com/dayexso" target="_blank" rel="noopener" aria-label="Instagram" class="social">◉</a>
        </div>
      </footer>

    </div>
  </main>

  <script src="script.js"></script>
  <script>
    (function () {
      const nav = document.getElementById('nav');
      if (!nav) return;

      let observer;
      let queued = false;

      const normalizeNavButtons = () => {
        if (!nav.isConnected) return;
        if (observer) observer.disconnect();

        const buttons = nav.querySelectorAll('button');
        buttons.forEach((btn) => {
          const original = (btn.textContent || '').trim();
          const lower = original.toLowerCase();

          if (lower === 'contact') {
            btn.remove();
            return;
          }

          if (lower === 'about') {
            if (original !== 'all') btn.textContent = 'all';
            return;
          }

          if (original && original !== lower) {
            btn.textContent = lower;
          }
        });

        nav.querySelectorAll('.sep').forEach((sep) => {
          const prev = sep.previousElementSibling;
          const next = sep.nextElementSibling;
          if (!prev || !next) sep.remove();
        });

        if (observer) observer.observe(nav, { childList: true, subtree: true });
      };

      const queueNormalize = () => {
        if (queued) return;
        queued = true;
        requestAnimationFrame(() => {
          queued = false;
          normalizeNavButtons();
        });
      };

      normalizeNavButtons();
      observer = new MutationObserver(queueNormalize);
      observer.observe(nav, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
