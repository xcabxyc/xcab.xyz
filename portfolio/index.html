<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XCABXYC — Day Powley Portfolio</title>
  <meta name="description" content="Portfolio of Day Powley — Design, Direction, and Personal work." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Main content -->
  <main class="content">
    <div class="container">

      <!-- Header / Navigation -->
      <header class="header">
        <button class="logo" id="logo" aria-label="Home">
          <span class="logo-name">xcabxyc</span>
        </button>
        <nav class="nav" id="nav"><!-- nav links injected by script.js --></nav>
      </header>

      <!-- Grid of blocks (injected by script.js) -->
      <div class="grid" id="grid"></div>

      <!-- Detail view (shown when a block is expanded) -->
      <div class="detail" id="detail" hidden></div>

      <!-- Footer -->
      <footer class="footer">
        <div class="copyright">
          &copy; <span class="year">2026</span> Day Powley
        </div>
        <div class="socials">
          <a href="mailto:hello@xcabxyc.com" aria-label="Email" class="social">✉</a>
          <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="Instagram" class="social">◉</a>
          <a href="https://linkedin.com" target="_blank" rel="noopener" aria-label="LinkedIn" class="social">in</a>
        </div>
      </footer>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
